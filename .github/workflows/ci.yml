name: CI Workflow

on:
  pull_request: 
    branches: ["main"]

jobs:
    build-and-test:
       runs-on: ubuntu-latest
       steps:
         - name: Code Checkout
           uses: actions/checkout@v3

         - name: Python Setup
           uses: actions/setup-python@v4
           with:
             python-version: "3.10"

         - name: Install Dependencies
           run: pip install -r requirements.txt

         - name: Unit Tests
           run: pytest

         - name: Docker Build Validation
           run: docker build -t student-ml-api:test .

